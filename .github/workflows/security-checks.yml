name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  service-role-leak-scan:
    name: Service-role leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-service-role-leak.mjs
