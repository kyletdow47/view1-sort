<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>March 27</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'Inter', sans-serif;
    overflow: hidden;
    padding: 60px 40px;
  }

  .day-label {
    font-size: clamp(11px, 2.5vw, 13px);
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #a855f7;
    margin-bottom: 12px;
    opacity: 0;
    animation: fade 0.4s ease 0.1s forwards;
  }

  .big-number {
    font-size: clamp(100px, 28vw, 200px);
    font-weight: 900;
    line-height: 0.85;
    letter-spacing: -6px;
    background: linear-gradient(135deg, #c084fc, #a855f7, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    animation: rise 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards;
    text-align: center;
  }

  .big-sub {
    font-size: clamp(13px, 3vw, 18px);
    color: #555;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 12px;
    margin-bottom: clamp(28px, 5vh, 48px);
    opacity: 0;
    animation: fade 0.4s ease 0.4s forwards;
  }

  .features {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .feature {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: #0a0a0a;
    border: 1px solid #1a1a1a;
    border-radius: 10px;
    opacity: 0;
    transform: translateX(-16px);
    animation: slideIn 0.4s ease forwards;
  }

  .feature-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7c3aed;
    flex-shrink: 0;
  }

  .feature-name {
    font-size: clamp(12px, 2.5vw, 14px);
    font-weight: 600;
    color: #ccc;
    flex: 1;
  }

  .feature-tag {
    font-size: 10px;
    color: #444;
    background: #111;
    border: 1px solid #222;
    border-radius: 4px;
    padding: 2px 8px;
    font-family: 'SF Mono', monospace;
    flex-shrink: 0;
  }

  .bottom {
    margin-top: clamp(20px, 4vh, 36px);
    font-size: 11px;
    color: #222;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0;
    animation: fade 0.4s ease 1.4s forwards;
  }

  @keyframes fade { to { opacity: 1; } }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
</style>
</head>
<body>

<div class="day-label">March 27 — Day 2</div>
<div class="big-number">38</div>
<div class="big-sub">Commits in 24 hours</div>

<div class="features">
  <div class="feature" style="animation-delay:0.5s">
    <div class="feature-dot"></div>
    <div class="feature-name">Auth, login, signup</div>
    <div class="feature-tag">Supabase</div>
  </div>
  <div class="feature" style="animation-delay:0.6s">
    <div class="feature-dot"></div>
    <div class="feature-name">Stripe Connect onboarding</div>
    <div class="feature-tag">Payments</div>
  </div>
  <div class="feature" style="animation-delay:0.7s">
    <div class="feature-dot"></div>
    <div class="feature-name">6 email templates</div>
    <div class="feature-tag">Resend</div>
  </div>
  <div class="feature" style="animation-delay:0.8s">
    <div class="feature-dot"></div>
    <div class="feature-name">Gallery + magic links</div>
    <div class="feature-tag">Client portal</div>
  </div>
  <div class="feature" style="animation-delay:0.9s">
    <div class="feature-dot"></div>
    <div class="feature-name">Mobile responsive dashboard</div>
    <div class="feature-tag">UI</div>
  </div>
  <div class="feature" style="animation-delay:1.0s">
    <div class="feature-dot"></div>
    <div class="feature-name">Batch rename + ZIP export</div>
    <div class="feature-tag">Core</div>
  </div>
  <div class="feature" style="animation-delay:1.1s">
    <div class="feature-dot"></div>
    <div class="feature-name">Loading states + error handling</div>
    <div class="feature-tag">UX</div>
  </div>
</div>

<div class="bottom">I had never built any of this before</div>

</body>
</html>
