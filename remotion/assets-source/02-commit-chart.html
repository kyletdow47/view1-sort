<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commit Chart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'Inter', sans-serif;
    overflow: hidden;
    padding: 60px 40px;
  }

  .header {
    text-align: center;
    margin-bottom: clamp(32px, 6vh, 56px);
    opacity: 0;
    animation: fade 0.5s ease 0.1s forwards;
  }
  .header h1 {
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 800;
    color: #fff;
    letter-spacing: -1px;
  }
  .header p {
    font-size: clamp(11px, 2.5vw, 14px);
    color: #444;
    margin-top: 6px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .chart {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(6px, 1.5vw, 12px);
    height: clamp(200px, 40vh, 320px);
  }

  .bar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    height: 100%;
    justify-content: flex-end;
    opacity: 0;
    animation: barRise 0.5s ease forwards;
  }

  .bar-count {
    font-size: clamp(9px, 2vw, 12px);
    font-weight: 700;
    color: #666;
    margin-bottom: 4px;
    transition: color 0.3s;
  }
  .bar-wrap.highlight .bar-count { color: #e9d5ff; }

  .bar {
    width: 100%;
    border-radius: 4px 4px 0 0;
    background: #1a1a1a;
    transition: background 0.3s;
    transform-origin: bottom;
    transform: scaleY(0);
    animation: grow 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
    animation-delay: var(--delay);
  }

  .bar-wrap.highlight .bar {
    background: linear-gradient(to top, #7c3aed, #a855f7, #c084fc);
    box-shadow: 0 0 20px rgba(168,85,247,0.4);
  }

  .bar-wrap.peak .bar {
    background: linear-gradient(to top, #0e7490, #06b6d4, #67e8f9);
    box-shadow: 0 0 28px rgba(6,182,212,0.5);
  }
  .bar-wrap.peak .bar-count { color: #a5f3fc; }

  .bar-date {
    font-size: clamp(7px, 1.5vw, 10px);
    color: #333;
    margin-top: 8px;
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .bar-wrap.highlight .bar-date,
  .bar-wrap.peak .bar-date { color: #888; }

  /* Annotation */
  .annotation {
    position: absolute;
    background: rgba(168,85,247,0.1);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 11px;
    color: #c084fc;
    white-space: nowrap;
    opacity: 0;
    animation: fade 0.4s ease 1.5s forwards;
  }

  .chart-wrap {
    position: relative;
    width: 100%;
    max-width: 640px;
  }

  .labels {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: clamp(20px, 4vh, 36px);
    opacity: 0;
    animation: fade 0.5s ease 1.2s forwards;
  }
  .label-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #555;
  }
  .label-dot {
    width: 10px; height: 10px; border-radius: 2px;
  }
  .label-dot.purple { background: #a855f7; }
  .label-dot.cyan { background: #06b6d4; }
  .label-dot.gray { background: #2a2a2a; }

  @keyframes fade { to { opacity: 1; } }
  @keyframes barRise { to { opacity: 1; } }
  @keyframes grow { to { transform: scaleY(1); } }

  .logo {
    position: absolute;
    top: 36px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #222;
  }
</style>
</head>
<body>
<div class="logo">View1 Sort</div>

<div class="header">
  <h1>184 Commits in 11 Days</h1>
  <p>March 26 — April 6, 2026</p>
</div>

<div class="chart-wrap">
  <div class="chart" id="chart"></div>
</div>

<div class="labels">
  <div class="label-item"><div class="label-dot gray"></div>Regular day</div>
  <div class="label-item"><div class="label-dot purple"></div>Mar 27 — 38 commits</div>
  <div class="label-item"><div class="label-dot cyan"></div>Apr 2 — 46 commits</div>
</div>

<script>
const data = [
  { date: "Mar 26", count: 5, type: "normal" },
  { date: "Mar 27", count: 38, type: "highlight" },
  { date: "Mar 28", count: 2, type: "normal" },
  { date: "Mar 29", count: 7, type: "normal" },
  { date: "Mar 30", count: 21, type: "normal" },
  { date: "Mar 31", count: 0, type: "normal" },
  { date: "Apr 1",  count: 13, type: "normal" },
  { date: "Apr 2",  count: 46, type: "peak" },
  { date: "Apr 3",  count: 6,  type: "normal" },
  { date: "Apr 4",  count: 17, type: "normal" },
  { date: "Apr 5",  count: 25, type: "normal" },
  { date: "Apr 6",  count: 4,  type: "normal" },
];

const max = Math.max(...data.map(d => d.count));
const chart = document.getElementById('chart');

data.forEach((d, i) => {
  const pct = max > 0 ? (d.count / max) * 100 : 0;
  const minH = d.count > 0 ? 4 : 0;
  const height = `max(${minH}px, ${pct}%)`;

  const wrap = document.createElement('div');
  wrap.className = `bar-wrap ${d.type}`;
  wrap.style.animationDelay = `${0.05 * i + 0.2}s`;

  wrap.innerHTML = `
    <div class="bar-count">${d.count > 0 ? d.count : ''}</div>
    <div class="bar" style="height:${height}; --delay:${0.05 * i + 0.3}s"></div>
    <div class="bar-date">${d.date}</div>
  `;
  chart.appendChild(wrap);
});
</script>
</body>
</html>
